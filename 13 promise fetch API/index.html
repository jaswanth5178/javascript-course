<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Fetch API Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            max-width: 100%;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Product List (Promises & Fetch)</h1>
    
    <!-- JavaScript will dynamically insert the products into this div -->
    <div id="products-container"></div>

    <script src="index.js"></script>
</body>
</html>
